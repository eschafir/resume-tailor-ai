[project]
name = "resume-tailor-ai"
version = "0.1.0"
description = "Multi-agent resume tailoring system with anti-hallucination guardrails"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "playwright>=1.45",
    "langgraph>=0.2",
    "langchain-core>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
